[package]
name = "herdr-clickup"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "A herdr plugin for ClickUp: board, tasks, spec-first worktrees and approved updates"
license = "MIT"
repository = "https://github.com/ssk090/herdr-clickup"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }
